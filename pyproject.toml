[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backtesting_api"
version = "0.1.0"
description = "JSON strategy backtesting API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
notebook = ["ipykernel==7.3.0", "pandas==3.0.5"]
intraday = ["pyarrow==25.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backtesting_api = ["web/*.html", "web/*.css", "web/*.mjs", "web/*.json", "web/vendor/*"]
