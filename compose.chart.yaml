services:
  chart:
    build: .
    command: ["python", "-m", "uvicorn", "backtest_hpg.chart_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${CHART_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      VN30F1M_SNAPSHOT_PATH: /app/data/vn30f1m-5m-20260316-20260915.json
